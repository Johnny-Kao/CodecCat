name: Question or documentation issue
description: Ask for help with usage, installing, or unclear documentation.
title: "[Question] "
body:
  - type: textarea
    id: question
    attributes:
      label: What are you trying to do?
      description: Include the relevant documentation page and what is unclear.
    validations:
      required: true
  - type: textarea
    id: attempted
    attributes:
      label: What have you tried?
      description: Include version, platform and safe error messages if relevant.
    validations:
      required: false
