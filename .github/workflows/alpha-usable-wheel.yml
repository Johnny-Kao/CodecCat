name: CodecCat usable alpha wheel (model + API + CLI)
on:
  push:
    branches: [main, release/alpha-main]
    tags: ["v*"]
    paths:
      - ".github/workflows/alpha-usable-wheel.yml"
      - "src/**"
      - "experiments/logic_first/**"
      - "tests/test_vnext_*.py"
      - "pyproject.toml"
      - ".gitignore"
      - "README.md"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/alpha-usable-wheel.yml"
      - "src/**"
      - "experiments/logic_first/**"
      - "tests/test_vnext_*.py"
      - "pyproject.toml"
      - ".gitignore"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: chardet/test-data
          ref: b0c0d206913ba118ffea2f7d306883e7a4a76db7
          path: training
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build and test tools
        run: python -m pip install build==1.3.0 hatchling numpy==2.5.3 scipy==1.18.1 scikit-learn==1.9.1 joblib==1.6.0 pytest==8.4.2
      - name: Run vNext runtime contracts
        run: PYTHONPATH=src python -m pytest -q tests/test_vnext_*.py
      - name: Build pinned alpha model
        run: >-
          PYTHONPATH=src python experiments/logic_first/build_installable_candidate.py
          --corpus training --training-commit b0c0d206913ba118ffea2f7d306883e7a4a76db7
      - name: Package a model-bearing wheel
        run: |
          python -m build --wheel --no-isolation
          python - <<'PY'
          from glob import glob
          import zipfile
          wheels=glob("dist/codeccat-*.whl")
          assert len(wheels)==1,wheels
          with zipfile.ZipFile(wheels[0]) as z:
              for filename in ("codeccat/models/stable23.zip", "codeccat/models/language-l3.json", "codeccat/models/manifest.json"):
                  assert filename in z.namelist(), filename
          print("MODEL_BUNDLED_PASS")
          PY
      - name: Verify CLI and API after clean installation
        run: |
          python -m venv .alpha-env
          .alpha-env/bin/python -m pip install dist/codeccat-*.whl
          .alpha-env/bin/python experiments/logic_first/alpha_installed_smoke.py
          .alpha-env/bin/codeccat --help
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: codeccat-usable-alpha-wheel-and-model-provenance
          path: |
            dist/*.whl
            src/codeccat/models/manifest.json
          retention-days: 30

  github-pre-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-run
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, tomllib
          with open("pyproject.toml","rb") as f:
              version=tomllib.load(f)["project"]["version"]
          assert os.environ["RELEASE_TAG"]=="v"+version, "tag/version mismatch"
          assert "a" in version or "b" in version or "rc" in version, "alpha job only"
          print("RELEASE_VERSION_MATCH",version)
          PY
      - uses: actions/download-artifact@v4
        with:
          name: codeccat-usable-alpha-wheel-and-model-provenance
          path: release-assets
      - name: Check release assets and checksums
        run: |
          python - <<'PY'
          import json, pathlib, zipfile
          root=pathlib.Path("release-assets")
          whls=list(root.rglob("codeccat-*.whl"))
          manifests=list(root.rglob("manifest.json"))
          assert len(whls)==1 and len(manifests)==1, (whls,manifests)
          manifest=json.loads(manifests[0].read_text())
          assert manifest["schema"]=="codeccat-alpha-bundled-model-v1"
          with zipfile.ZipFile(whls[0]) as z:
              for x in ("codeccat/models/stable23.zip", "codeccat/models/language-l3.json", "codeccat/models/manifest.json"):
                  assert x in z.namelist(),x
          print("RELEASE_ASSETS_VERIFIED",whls[0])
          PY
          cd release-assets
          sha256sum *.whl > SHA256SUMS
      - name: Publish annotated GitHub alpha pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Release already exists; updating assets"
            gh release upload "$RELEASE_TAG" release-assets/*.whl release-assets/SHA256SUMS --clobber --repo "$GH_REPO"
          else
            gh release create "$RELEASE_TAG" release-assets/*.whl release-assets/SHA256SUMS \
              --repo "$GH_REPO" --verify-tag --prerelease \
              --title "CodecCat $RELEASE_TAG (Alpha)" \
              --notes "Experimental alpha release with a model-bearing installable wheel.

          Includes: default stable23 inference model, opt-in L3, Python API and CLI.

          Verified: source unit tests, clean wheel installation, real Python/CLI decoding, UTF BOM regression tests.

          Not a production release. Accuracy varies by source; trained-model redistribution provenance is still under review. No PyPI distribution is implied."
          fi
