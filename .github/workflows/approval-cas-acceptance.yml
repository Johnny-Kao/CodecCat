name: Approval token and CAS transition tests
on:
  push:
    branches: [research/encoding-identifiability-audit]
    paths: [src/codeccat/approval_registry.py, experiments/logic_first/approval_cas_acceptance.py, .github/workflows/approval-cas-acceptance.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: PYTHONPATH=src python experiments/logic_first/approval_cas_acceptance.py
