name: P5 branch-elision tournament

on:
  push:
    branches:
      - research/charset-normalizer-e2e-baseline
    paths:
      - ".github/workflows/charset-p5-branch-elision-tournament.yml"
      - "experiments/charset-normalizer-e2e-baseline/charset_p5_branch_elision_tournament.py"
      - "experiments/charset-normalizer-e2e-baseline/charset_p4_residual_python_tournament.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tournament:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: chardet/test-data
          path: test-data
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: Ousret/char-dataset
          ref: master
          path: char-dataset
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --no-cache-dir numpy scikit-learn requests warcio
      - name: Run P5 branch-elision tournament
        env:
          PAIR_A: utf-8
          PAIR_B: utf-8-sig
          PYTHONHASHSEED: "0"
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: python experiments/charset-normalizer-e2e-baseline/charset_p5_branch_elision_tournament.py
