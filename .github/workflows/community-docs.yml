name: Community documentation checks

on:
  pull_request:
    paths:
      - "README.md"
      - "ROADMAP.md"
      - "CONTRIBUTING.md"
      - "MAINTAINING.md"
      - "SECURITY.md"
      - "CODE_OF_CONDUCT.md"
      - "SUPPORT.md"
      - "RELEASE_CHECKLIST_NATIVE.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/CODEOWNERS"
      - "scripts/check_community_docs.py"
      - ".github/workflows/community-docs.yml"
  push:
    branches:
      - main
      - docs/oss-community-maintenance-20261106
    paths:
      - "README.md"
      - "ROADMAP.md"
      - "CONTRIBUTING.md"
      - "MAINTAINING.md"
      - "SECURITY.md"
      - "CODE_OF_CONDUCT.md"
      - "SUPPORT.md"
      - "RELEASE_CHECKLIST_NATIVE.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/CODEOWNERS"
      - "scripts/check_community_docs.py"
      - ".github/workflows/community-docs.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate community docs and GitHub issue forms
        run: |
          python -m pip install --disable-pip-version-check "PyYAML==6.0.2"
          python scripts/check_community_docs.py
