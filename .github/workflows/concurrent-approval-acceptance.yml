name: Model concurrent approval safety
on:
  push:
    branches: [research/encoding-identifiability-audit]
    paths: [experiments/logic_first/concurrent_approval_acceptance.py, .github/workflows/concurrent-approval-acceptance.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: PYTHONPATH=src python experiments/logic_first/concurrent_approval_acceptance.py
