name: CodecCat five-corpus three-detector benchmark
on:
  push:
    branches: [research/five-corpus-benchmark-20261106]
    paths:
      - "experiments/five_corpus_benchmark.py"
      - "experiments/native_utf8_external_gate.py"
      - ".github/workflows/five-corpus-benchmark.yml"
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: "Native six-platform CI run ID; if omitted, test published release"
        required: false
        default: ""
permissions:
  contents: read
  actions: read
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      PYTHONUNBUFFERED: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: chardet/test-data
          ref: b0c0d206913ba118ffea2f7d306883e7a4a76db7
          path: benchmark-sources/chardet
      - uses: actions/checkout@v4
        with:
          repository: jawah/charset_normalizer
          ref: 7d74fe4a8341ae27a8f42c759793301dbd304e10
          path: benchmark-sources/charset_normalizer
          sparse-checkout: data
      - uses: actions/checkout@v4
        with:
          repository: vim/vim
          ref: 88d96a15f99851faca0cacbbbdcede3f8c25149b
          path: benchmark-sources/vim
          sparse-checkout: src/po
      - uses: actions/checkout@v4
        with:
          repository: git/git
          ref: 0ffa3e35c7c82ab8d0de226149fb03b3f7674d05
          path: benchmark-sources/git
          sparse-checkout: po
      - uses: actions/checkout@v4
        if: inputs.candidate_run_id != ''
        with:
          repository: GNOME/glib
          ref: d34a927488b8b664cbd305dc880e86f34f8ca467
          path: benchmark-sources/glib
          sparse-checkout: po
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch candidate native wheel from validated six-platform CI
        if: inputs.candidate_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: native-wheel-linux-x64
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: candidate-wheel
      - name: Install exact native wheel and pinned competitors
        shell: bash
        run: |
          if [[ -n "${{ inputs.candidate_run_id }}" ]]; then
            python -m pip install --no-deps candidate-wheel/*.whl
          else
            python -m pip install --no-deps "https://github.com/Johnny-Kao/CodecCat/releases/download/v0.1.0a4/codeccat-0.1.0a4-cp310-abi3-linux_x86_64.whl"
          fi
          python -m pip install "chardet==7.7.0" "charset-normalizer==3.5.2"
      - name: Generate frozen seeded nonoverlapping test groups
        run: python experiments/five_corpus_benchmark.py --prepare
      - name: Run three engines independently on each of five corpora
        shell: bash
        run: |
          for corpus in 1 2 3 4 5; do
            for engine in codeccat chardet charset_normalizer; do
              python experiments/five_corpus_benchmark.py --worker "$engine" --corpus "$corpus"
            done
          done
          python experiments/five_corpus_benchmark.py --summary
      - name: Compare candidate to frozen released-Wheel baseline
        if: inputs.candidate_run_id != ''
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("research-results/five-corpus/summary.json").read_text())
          ours=x["overall"]["codeccat"]
          pools=x["by_source_pool"]
          print("CANDIDATE_NATIVE_QUALITY",json.dumps({"overall":ours,"by_pool":{k:v["codeccat"] for k,v in pools.items()}}))
          assert ours["n"]==843, ("dataset not the same",ours["n"])
          assert ours["correct_text"]>=805, ("overall decoding regression",ours)
          assert pools["chardet"]["codeccat"]["correct_text"]>=622, "training-source regression"
          assert pools["charset_normalizer"]["codeccat"]["correct_text"]>=14, "upstream fixture regression"
          assert pools["codeccat_external"]["codeccat"]["correct_text"]>=169, "external-source regression"
          print("CANDIDATE_NATIVE_QUALITY_GATE_PASS")
          PY
      - name: Compare candidate to released baseline on fresh pinned GLib catalogs
        if: inputs.candidate_run_id != ''
        shell: bash
        run: |
          test "$(git -C benchmark-sources/glib rev-parse HEAD)" = "d34a927488b8b664cbd305dc880e86f34f8ca467"
          python -m venv .native-baseline
          .native-baseline/bin/python -m pip install --no-deps "https://github.com/Johnny-Kao/CodecCat/releases/download/v0.1.0a3/codeccat-0.1.0a3-cp310-abi3-linux_x86_64.whl"
          python - <<'PY'
          import subprocess
          code = ("import hashlib,importlib.metadata as md; from importlib.resources import files; "
                  "print(md.version('codeccat'),hashlib.sha256("
                  "files('codeccat').joinpath('models/default.ccm').read_bytes()).hexdigest())")
          old = subprocess.check_output([".native-baseline/bin/python", "-c", code], text=True).split()
          new = subprocess.check_output(["python", "-c", code], text=True).split()
          print("PAIRED_RELEASE_MODEL_IDENTITY",old,new)
          assert old[0] == "0.1.0a3" and new[0] == "0.1.0a4"
          assert old[1] == new[1], "Cannot attribute improvement to decoder: model changed"
          PY
          .native-baseline/bin/python experiments/native_utf8_external_gate.py --engine baseline
          python experiments/native_utf8_external_gate.py --engine candidate
          python experiments/native_utf8_external_gate.py --compare
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: five-corpus-results
          path: |
            research-results/five-corpus/manifest.json
            research-results/five-corpus/summary.json
            research-results/five-corpus/[1-5]-*.json
            research-results/five-corpus/glib-*.json
          if-no-files-found: warn
          retention-days: 30
