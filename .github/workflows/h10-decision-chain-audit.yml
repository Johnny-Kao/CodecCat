name: H10 offline decision chain audit
on:
  push:
    branches: [staging/initial-package]
    paths:
      - ".github/workflows/h10-decision-chain-audit.yml"
      - "experiments/charset-normalizer-e2e-baseline/h10_decision_chain_offline_audit.py"
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Preflight
        run: python -m compileall -q experiments/charset-normalizer-e2e-baseline/h10_decision_chain_offline_audit.py
      - name: Download H7 immutable trace
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/h7
          gh run download 38553419903 --repo "${{ github.repository }}" --name h7-paired-attribution --dir artifacts/h7
          test -s artifacts/h7/sample-trace.csv
      - name: Audit scorer and downstream
        run: |
          python experiments/charset-normalizer-e2e-baseline/h10_decision_chain_offline_audit.py --input artifacts/h7/sample-trace.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h10-decision-chain-audit
          path: research-results/h10/
          retention-days: 30
