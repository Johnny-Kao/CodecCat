name: H12 Japanese decoder structural evidence
on:
  push:
    branches: [staging/initial-package]
    paths:
      - ".github/workflows/h12-japanese-evidence.yml"
      - "experiments/charset-normalizer-e2e-baseline/h12_japanese_decoder_evidence.py"
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install numpy==2.5.3 scipy==1.18.1 scikit-learn==1.9.1 joblib==1.6.0 requests==2.34.2 warcio==1.8.1
          python -m pip install -e .
      - name: Preflight
        run: python -m compileall -q experiments/charset-normalizer-e2e-baseline/h12_japanese_decoder_evidence.py
      - name: Frozen model
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/r21
          gh run download 37568792009 --repo "${{ github.repository }}" --name codeccat-r20-release-candidate --dir artifacts/r21
          echo "e792df1be4a4a07f052c7786e61122d547a3c87501ad5b40f729621e8019fb54  artifacts/r21/codeccat-r20-release-candidate.npz" | sha256sum -c -
      - name: Inspect Japanese decoder evidence
        run: |
          PYTHONPATH=src:experiments/charset-normalizer-e2e-baseline python experiments/charset-normalizer-e2e-baseline/h12_japanese_decoder_evidence.py --model artifacts/r21/codeccat-r20-release-candidate.npz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h12-japanese-evidence
          path: research-results/h12/
          retention-days: 30
