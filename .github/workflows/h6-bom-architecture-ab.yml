name: H6 one-shot BOM architecture and accuracy-budget A/B

on:
  push:
    branches: [staging/initial-package]
    paths:
      - ".github/workflows/h6-bom-architecture-ab.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  study:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
      MODEL_SHA256: "e792df1be4a4a07f052c7786e61122d547a3c87501ad5b40f729621e8019fb54"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        run: |
          python -m pip install --no-cache-dir \
            numpy==2.5.3 scipy==1.18.1 scikit-learn==1.9.1 \
            joblib==1.6.0 requests==2.34.2 warcio==1.8.1 \
            chardet==7.0.1 charset-normalizer==3.4.4
          python -m pip install -e .
      - name: Download immutable R21
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/r21
          gh run download 37568792009 \
            --repo "${{ github.repository }}" \
            --name codeccat-r20-release-candidate \
            --dir artifacts/r21
      - name: Single-run stage architecture A/B and fresh evaluation
        run: |
          PYTHONPATH=src:experiments/charset-normalizer-e2e-baseline python \
            experiments/charset-normalizer-e2e-baseline/h6_bom_architecture_accuracy_budget.py \
            --model artifacts/r21/codeccat-r20-release-candidate.npz \
            --sha256 "$MODEL_SHA256"
