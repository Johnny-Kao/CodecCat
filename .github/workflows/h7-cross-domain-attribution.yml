name: H7 cross-domain paired attribution
on:
  push:
    branches: [staging/initial-package]
    paths:
      - ".github/workflows/h7-cross-domain-attribution.yml"
      - "experiments/charset-normalizer-e2e-baseline/h7_cross_domain_attribution.py"
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  attribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      MODEL_SHA: "e792df1be4a4a07f052c7786e61122d547a3c87501ad5b40f729621e8019fb54"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        run: |
          python -m pip install numpy==2.5.3 scipy==1.18.1 scikit-learn==1.9.1 joblib==1.6.0 requests==2.34.2 warcio==1.8.1 chardet==7.0.1 charset-normalizer==3.4.4
          python -m pip install -e .
      - name: Compile source and experiment before data collection
        run: |
          python -m compileall -q src/codeccat experiments/charset-normalizer-e2e-baseline/h7_cross_domain_attribution.py
          PYTHONPATH=src:experiments/charset-normalizer-e2e-baseline python -c "import h7_cross_domain_attribution; print('H7_IMPORT_PASS')"
      - name: Download immutable R21
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/r21
          gh run download 37568792009 --repo "${{ github.repository }}" --name codeccat-r20-release-candidate --dir artifacts/r21
          echo "$MODEL_SHA  artifacts/r21/codeccat-r20-release-candidate.npz" | sha256sum -c -
      - name: H7 smoke and single-pass paired attribution
        run: |
          PYTHONPATH=src:experiments/charset-normalizer-e2e-baseline python experiments/charset-normalizer-e2e-baseline/h7_cross_domain_attribution.py --model artifacts/r21/codeccat-r20-release-candidate.npz --sha256 "$MODEL_SHA"
      - name: Publish H7 diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h7-paired-attribution
          path: research-results/h7/
          retention-days: 30
          if-no-files-found: warn
