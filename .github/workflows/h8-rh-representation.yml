name: H8 single-run RH representation architecture A/B
on:
  push:
    branches: [staging/initial-package]
    paths:
      - ".github/workflows/h8-rh-representation.yml"
      - "experiments/charset-normalizer-e2e-baseline/h8_rh_sampling_architecture.py"
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencies
        run: |
          python -m pip install numpy==2.5.3 scipy==1.18.1 scikit-learn==1.9.1 joblib==1.6.0 requests==2.34.2 warcio==1.8.1 chardet==7.0.1 charset-normalizer==3.4.4
          python -m pip install -e .
      - name: Preflight syntax and import
        run: |
          python -m compileall -q experiments/charset-normalizer-e2e-baseline/h8_rh_sampling_architecture.py
          PYTHONPATH=src:experiments/charset-normalizer-e2e-baseline python -c "import h8_rh_sampling_architecture; print('H8_IMPORT_PASS')"
      - name: Download frozen model
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/r21
          gh run download 37568792009 --repo "${{ github.repository }}" --name codeccat-r20-release-candidate --dir artifacts/r21
          echo "e792df1be4a4a07f052c7786e61122d547a3c87501ad5b40f729621e8019fb54  artifacts/r21/codeccat-r20-release-candidate.npz" | sha256sum -c -
      - name: One-shot architecture comparison with prospective data
        run: |
          PYTHONPATH=src:experiments/charset-normalizer-e2e-baseline python experiments/charset-normalizer-e2e-baseline/h8_rh_sampling_architecture.py --model artifacts/r21/codeccat-r20-release-candidate.npz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h8-rh-representation
          path: research-results/architecture/
          retention-days: 30
          if-no-files-found: warn
