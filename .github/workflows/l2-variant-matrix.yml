name: One-shot L2 multi-variant experiment
on:
  push:
    branches: [research/encoding-identifiability-audit]
    paths: [experiments/logic_first/l2_variant_matrix.py, .github/workflows/l2-variant-matrix.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, unigram_bigram, balanced_12, binary_12, wide_12]
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: chardet/test-data
          ref: b0c0d206913ba118ffea2f7d306883e7a4a76db7
          path: training
      - uses: actions/checkout@v4
        with:
          repository: jawah/charset_normalizer
          path: external/charset_normalizer
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy==2.5.3 scipy==1.18.1 scikit-learn==1.9.1 joblib==1.6.0
      - run: PYTHONPATH=src:experiments/logic_first python experiments/logic_first/l2_variant_matrix.py ${{ matrix.variant }} research-results/variant-matrix
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: variant-${{ matrix.variant }}
          path: research-results/variant-matrix/
          retention-days: 30
