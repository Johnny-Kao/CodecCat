name: Native L2 Rust parity prototype
on:
  push:
    branches: [refactor/native-inference-v1]
    paths:
      - "native-prototype/**"
      - ".github/workflows/native-l2-parity.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: chardet/test-data
          ref: b0c0d206913ba118ffea2f7d306883e7a4a76db7
          path: training
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build isolated Native scorer
        run: |
          python -m pip install maturin==1.9.4
          maturin build --release --manifest-path native-prototype/Cargo.toml --out native-prototype/dist
      - name: Verify Native Wheel has no heavy inference dependencies
        run: |
          python -m venv .native-clean
          .native-clean/bin/python -m pip install native-prototype/dist/*.whl
          .native-clean/bin/python - <<'PY'
          import importlib.util
          import _codeccat_native
          for name in ("numpy","scipy","sklearn","joblib"):
              assert importlib.util.find_spec(name) is None, name
          print("NATIVE_WHEEL_NO_HEAVY_RUNTIME_DEPS_PASS")
          PY
      - name: Train frozen Alpha in CI (offline training dependencies)
        run: |
          python -m pip install numpy==2.5.3 scipy==1.18.1 scikit-learn==1.9.1 joblib==1.6.0
          PYTHONPATH=src python experiments/logic_first/build_installable_candidate.py --corpus training --training-commit b0c0d206913ba118ffea2f7d306883e7a4a76db7
          python -m pip install native-prototype/dist/*.whl
      - name: Compare native feature and scoring parity
        run: PYTHONPATH=src:experiments/logic_first python native-prototype/verify_native.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-prototype-wheel
          path: native-prototype/dist/*.whl
          retention-days: 10
