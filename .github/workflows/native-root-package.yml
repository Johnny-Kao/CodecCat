name: Native root package smoke
on:
  push:
    branches: [refactor/native-inference-v1]
    paths:
      - "pyproject.toml"
      - "native-prototype/**"
      - ".github/workflows/native-root-package.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-root-package-${{ github.ref }}
  cancel-in-progress: true
jobs:
  root-wheel:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: chardet/test-data
          ref: b0c0d206913ba118ffea2f7d306883e7a4a76db7
          path: training
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate the frozen test models (not a release publication)
        run: |
          python -m pip install numpy==2.5.3 scipy==1.18.1 scikit-learn==1.9.1 joblib==1.6.0
          PYTHONPATH=src python experiments/logic_first/build_installable_candidate.py --corpus training --training-commit b0c0d206913ba118ffea2f7d306883e7a4a76db7
          mkdir -p native-prototype/python/codeccat/models native-prototype/model
          PYTHONPATH=src python native-prototype/export_ccm.py --precision f32 --output native-prototype/python/codeccat/models/default.ccm
          PYTHONPATH=src python native-prototype/export_ccm.py --precision f64 --output native-prototype/model/stable23.ccm
          cp src/codeccat/models/language-l3.json native-prototype/python/codeccat/models/language-l3.json
          PYTHONPATH=src:experiments/logic_first python native-prototype/api_parity.py generate
          PYTHONPATH=src:experiments/logic_first python native-prototype/verify_native.py generate
      - name: Build wheel strictly from repository root
        run: |
          python -m pip install build==1.3.0
          python -m build --wheel --outdir dist .
          python -m pip install wheel
          python - <<'PY'
          import glob, zipfile
          wheels = glob.glob("dist/*.whl")
          assert len(wheels) == 1, wheels
          with zipfile.ZipFile(wheels[0]) as whl:
              names = whl.namelist()
              assert any(x.startswith("codeccat/_codeccat_native") for x in names), "native extension absent"
              assert "codeccat/models/default.ccm" in names, "default model absent"
              metadata = next(x for x in names if x.endswith(".dist-info/METADATA"))
              data = whl.read(metadata).decode()
              assert "Name: codeccat" in data
              assert "Version: 0.1.0a3" in data
              assert "Provides-Extra: legacy" in data
              assert "Requires-Dist: scikit-learn" not in data
              assert "Requires-Dist: scipy" not in data
              print("ROOT_WHEEL_METADATA_PASS", wheels[0])
          PY
      - name: Audit wheel for bundled raw corpus and model feature bounds
        run: |
          python native-prototype/audit_release_wheel.py dist/*.whl
      - name: Test installed root wheel with no ML dependencies
        shell: bash
        run: |
          python -m venv .root-clean
          .root-clean/bin/python -m pip install dist/*.whl
          .root-clean/bin/python native-prototype/api_parity.py verify
          .root-clean/bin/python native-prototype/verify_native.py verify
          .root-clean/bin/python native-prototype/release_reliability.py
          .root-clean/bin/python -m pip check
          .root-clean/bin/python - <<'PY'
          import codeccat, importlib.util
          assert all(importlib.util.find_spec(m) is None for m in ("numpy", "scipy", "sklearn", "joblib"))
          assert codeccat.detect(b"hello").text == "hello"
          print("ROOT_WHEEL_CLEAN_INSTALL_PASS")
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: native-root-wheel-test-only
          path: dist/*.whl
          retention-days: 7
