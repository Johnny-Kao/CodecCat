name: NEW architecture Round 3 of 5
on:
  push:
    branches: [staging/initial-package]
    paths: [".github/workflows/new-arch-round3.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  batch:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: chardet/test-data
          ref: b0c0d206913ba118ffea2f7d306883e7a4a76db7
          path: fixtures
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencies once
        run: python -m pip install numpy==2.5.3 scipy==1.18.1 scikit-learn==1.9.1
      - name: New evidence topology paired comparison
        run: PYTHONPATH=fixtures/scripts python experiments/logic_first/new_arch_round3.py --fixtures fixtures
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: new-architecture-round3
          path: research-results/new-arch-round3/
          retention-days: 30
