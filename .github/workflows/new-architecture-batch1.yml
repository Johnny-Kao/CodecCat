name: NEW independent architecture batch 1
on:
  push:
    branches: [staging/initial-package]
    paths: [".github/workflows/new-architecture-batch1.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  one-batch:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: chardet/test-data
          ref: b0c0d206913ba118ffea2f7d306883e7a4a76db7
          path: fixtures
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install train dependencies once
        run: python -m pip install numpy==2.5.3 scipy==1.18.1 scikit-learn==1.9.1
      - name: Independent grouped architecture contest
        run: |
          PYTHONPATH=fixtures/scripts python experiments/logic_first/new_architecture_batch1.py --fixtures fixtures
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: new-architecture-batch1-results
          path: research-results/new-arch-batch1/
          retention-days: 30
