name: Paired large grouped-fold CodecCat vs chardet benchmark
on:
  push:
    branches: [research/encoding-identifiability-audit]
    paths:
      - experiments/logic_first/paired_large_benchmark.py
      - .github/workflows/paired-large-benchmark.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: chardet/test-data
          ref: b0c0d206913ba118ffea2f7d306883e7a4a76db7
          path: training
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy==2.5.3 scipy==1.18.1 scikit-learn==1.9.1 joblib==1.6.0 chardet==7.0.1 charset-normalizer==3.4.4
      - run: PYTHONPATH=src:experiments/logic_first python experiments/logic_first/paired_large_benchmark.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paired-large-benchmark
          path: research-results/paired-large-benchmark/
          retention-days: 30
