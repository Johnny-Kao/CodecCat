name: Product memory baseline - isolated processes
on:
  push:
    branches: [staging/initial-package]
    paths:
      - ".github/workflows/product-memory-baseline.yml"
      - "experiments/charset-normalizer-e2e-baseline/product_memory_baseline.py"
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  memory:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        run: |
          python -m pip install numpy==2.5.3 scipy==1.18.1 scikit-learn==1.9.1 joblib==1.6.0 requests==2.34.2 warcio==1.8.1 chardet==7.0.1 charset-normalizer==3.4.4
          python -m pip install -e .
      - name: Verify memory harness imports and syntax
        run: |
          python -m compileall -q experiments/charset-normalizer-e2e-baseline/product_memory_baseline.py
      - name: Download immutable artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/r21
          gh run download 37568792009 --repo "${{ github.repository }}" --name codeccat-r20-release-candidate --dir artifacts/r21
          echo "e792df1be4a4a07f052c7786e61122d547a3c87501ad5b40f729621e8019fb54  artifacts/r21/codeccat-r20-release-candidate.npz" | sha256sum -c -
      - name: Baseline isolated RSS and allocations
        run: |
          PYTHONPATH=src:experiments/charset-normalizer-e2e-baseline python experiments/charset-normalizer-e2e-baseline/product_memory_baseline.py --model artifacts/r21/codeccat-r20-release-candidate.npz
      - name: Upload memory report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-memory-baseline
          path: research-results/memory-baseline/
          if-no-files-found: warn
