name: Publish CodecCat to PyPI

# Manual only: never publish on push, PR or tag creation.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Immutable reviewed Stable tag (vMAJOR.MINOR.PATCH)"
        required: true
        type: string
      publish:
        description: "Publish exact verified GitHub Release packages using PyPI OIDC"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: pypi-publish-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  verify:
    name: Audit tag, released distributions and frozen model
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          path: tagged-source
          persist-credentials: false
      - name: Check stable tag and existing non-prerelease GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "Johnny-Kao/CodecCat"
          test "$GITHUB_REF" = "refs/heads/main"
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          # v0.1.0 was published using its legacy pinned process.
          test "$TAG" != "v0.1.0"
          git -C tagged-source rev-parse HEAD
          actual=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha')
          kind=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.type')
          if [[ "$kind" == "tag" ]]; then
            actual=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$actual" --jq '.object.sha')
          else
            test "$kind" = "commit"
          fi
          test "$actual" = "$(git -C tagged-source rev-parse HEAD)"
          release=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '[.draft,.prerelease] | @json')
          test "$release" = "[false,false]"
          echo "RELEASE_TAG_AND_VISIBILITY_VERIFIED $TAG $actual"
      - name: Download published GitHub Release assets exactly, without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p original-dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir original-dist
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate the tag-bound version, model, wheels, checksums and optional sdist
        env:
          TAG: ${{ inputs.tag }}
        run: |
          python scripts/verify_release_assets.py --tagged-source tagged-source \
            --assets original-dist --tag "$TAG" --out dist
          python -m pip install --disable-pip-version-check twine==7.0.0
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: verified-pypi-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish reviewed immutable packages via OIDC
    needs: verify
    if: ${{ inputs.publish == true && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/codeccat/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verified-pypi-distributions
          path: dist/
      - name: Publish to PyPI and generate attestations
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
