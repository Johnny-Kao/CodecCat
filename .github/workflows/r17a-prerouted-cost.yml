name: R17A prerouted incremental cost

on:
  push:
    branches: [staging/initial-package]
    paths:
      - ".github/workflows/r17a-prerouted-cost.yml"
      - "experiments/charset-normalizer-e2e-baseline/r17a_prerouted_incremental_cost.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cost:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        run: |
          python -m pip install --no-cache-dir \
            numpy==2.5.3 scipy==1.18.1 scikit-learn==1.9.1 \
            joblib==1.6.0 requests==2.34.2 warcio==1.8.1
          python -m pip install -e .
      - name: Restore canonical fitted state
        uses: actions/cache@v4
        with:
          path: .cache/codeccat/folds-v1.joblib
          key: codeccat-fold-v1-py312-sklearn191-ccmain202639-training-v1
          fail-on-cache-miss: true
      - name: Run R17A
        run: |
          PYTHONPATH=src:experiments/charset-normalizer-e2e-baseline python \
            experiments/charset-normalizer-e2e-baseline/r17a_prerouted_incremental_cost.py \
            --state .cache/codeccat/folds-v1.joblib
