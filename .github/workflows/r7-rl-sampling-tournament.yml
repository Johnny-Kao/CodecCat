name: R7 RL sampling tournament

on:
  push:
    branches:
      - staging/initial-package
    paths:
      - ".github/workflows/r7-rl-sampling-tournament.yml"
      - "experiments/charset-normalizer-e2e-baseline/r7_rl_sampling_tournament.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tournament:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: chardet/test-data
          path: test-data
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: Ousret/char-dataset
          ref: master
          path: char-dataset
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        run: |
          python -m pip install --no-cache-dir \
            numpy==2.5.3 scipy==1.18.1 scikit-learn==1.9.1 \
            joblib==1.6.0 requests==2.34.2 warcio==1.8.1
          python -m pip install -e .
      - name: Restore canonical development fold state
        uses: actions/cache@v4
        with:
          path: .cache/codeccat/folds-v1.joblib
          key: codeccat-fold-v1-py312-sklearn191-ccmain202639-training-v1
          fail-on-cache-miss: true
      - name: Restore frozen R7 RL development corpus
        uses: actions/cache@v4
        with:
          path: .cache/codeccat/r7-ccmain202634-rl-v1.joblib
          key: codeccat-r7-ccmain202634-rl-v1
      - name: Run bundled RL sampling tournament
        run: |
          PYTHONPATH=src:experiments/charset-normalizer-e2e-baseline python \
            experiments/charset-normalizer-e2e-baseline/r7_rl_sampling_tournament.py \
            --state .cache/codeccat/folds-v1.joblib \
            --development-crawl CC-MAIN-2026-34 \
            --development-corpus-cache .cache/codeccat/r7-ccmain202634-rl-v1.joblib
