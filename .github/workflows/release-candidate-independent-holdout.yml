name: Release candidate independent holdout

on:
  push:
    branches:
      - staging/initial-package
    paths:
      - ".github/workflows/release-candidate-independent-holdout.yml"
      - "experiments/charset-normalizer-e2e-baseline/release_candidate_independent_holdout.py"
      - "src/codeccat/model_io.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PAIR_A: utf-8
      PAIR_B: utf-8-sig
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: chardet/test-data
          path: test-data
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: Ousret/char-dataset
          ref: master
          path: char-dataset
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        run: |
          python -m pip install --no-cache-dir             numpy==2.5.3 scipy==1.18.1 scikit-learn==1.9.1             joblib==1.6.0 requests==2.34.2 warcio==1.8.1             charset-normalizer==3.5.2 chardet==7.6.0
          python -m pip install -e .
      - name: Restore canonical development fold state
        uses: actions/cache@v4
        with:
          path: .cache/codeccat/folds-v1.joblib
          key: codeccat-fold-v1-py312-sklearn191-ccmain202639-training-v1
          fail-on-cache-miss: true
      - name: Train frozen release candidate and evaluate independent crawl
        working-directory: experiments/charset-normalizer-e2e-baseline
        run: |
          PYTHONPATH=../../src:.:../.. python release_candidate_independent_holdout.py             --state ../../.cache/codeccat/folds-v1.joblib             --model-out ../../artifacts/codeccat-release-candidate-v1.npz             --holdout-crawl CC-MAIN-2026-34
      - uses: actions/upload-artifact@v4
        with:
          name: codeccat-release-candidate-v1
          path: artifacts/codeccat-release-candidate-v1.npz
          if-no-files-found: error
