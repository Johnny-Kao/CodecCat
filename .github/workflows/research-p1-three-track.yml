name: P1 3-track charset research audit
on:
  pull_request:
    paths:
      - "research/scripts/p1_three_track_audit.py"
      - ".github/workflows/research-p1-three-track.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: shabanali-faghani/IUST-HTMLCharDet
          ref: 0a7f382e2d488d46f1e12bad647f0384c4a2288f
          path: external-iust
          sparse-checkout: eval/test-data/encoding-wise/corpus.zip
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: chardet/test-data
          ref: b0c0d206913ba118ffea2f7d306883e7a4a76db7
          path: source-data
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: coodoing/piconv
          ref: 3a450b6a6f2c92e9a359ac7a91afe9551d4a120c
          path: independent-piconv
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: python/cpython
          ref: f64e51563a85667446793ad61ea521d005ceb171
          path: independent-cpython
          sparse-checkout: Lib/test/cjkencodings
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: jawah/charset_normalizer
          ref: 7d74fe4a8341ae27a8f42c759793301dbd304e10
          path: independent-charset-normalizer
          sparse-checkout: data/sample-chinese.txt
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Frozen CodecCat Runtime and independent HTML standard implementation
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir --only-binary=:all: codeccat==0.1.1 html5lib==1.1
          python datasets/official/prepare_manifest.py --corpus source-data
          python -m py_compile research/scripts/p1_three_track_audit.py
      - name: Execute all three research tracks
        run: python research/scripts/p1_three_track_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p1-three-track-metadata-only
          path: research-results/p1-three-track-audit.json
          if-no-files-found: warn
          retention-days: 30
