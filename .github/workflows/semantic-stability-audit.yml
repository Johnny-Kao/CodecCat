name: Binary false-acceptance and steady-state audit
on:
  push:
    branches: [research/encoding-identifiability-audit]
    paths: [experiments/logic_first/semantic_stability_audit.py, .github/workflows/semantic-stability-audit.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: chardet/test-data
          ref: b0c0d206913ba118ffea2f7d306883e7a4a76db7
          path: training
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy==2.5.3 scipy==1.18.1 scikit-learn==1.9.1 joblib==1.6.0
      - run: PYTHONPATH=src:experiments/logic_first python experiments/logic_first/semantic_stability_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semantic-stability-evidence
          path: research-results/semantic-stability/report.json
