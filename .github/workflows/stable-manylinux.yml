name: Stable gate - manylinux
on:
  push:
    branches: [main, staging/stable-release-gates-20261106]
    tags: ["v*"]
    paths:
      - ".github/workflows/stable-manylinux.yml"
      - "pyproject.toml"
      - "native-prototype/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, arch: x86_64, label: x64, image: quay.io/pypa/manylinux_2_28_x86_64}
          - {runner: ubuntu-24.04-arm, arch: aarch64, label: arm64, image: quay.io/pypa/manylinux_2_28_aarch64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Load the immutable alpha model and reference checks
        shell: bash
        run: |
          mkdir -p ci-fixtures native-prototype/model native-prototype/python/codeccat/models
          curl -fL --retry 3 -o /tmp/native-reference.tar.gz https://github.com/Johnny-Kao/CodecCat/releases/download/v0.1.0a4/native-reference-v0.1.0a4.tar.gz
          echo "e3dd654817fb0e3324910b1a39af9bc19185400582d5a066c533d7cc5dd81c8c  /tmp/native-reference.tar.gz" | sha256sum -c -
          tar -xzf /tmp/native-reference.tar.gz -C ci-fixtures
          echo "16073306b5027bf93acc2883f57fbda0cb0cf2d77b9a7bb62cf1b07fcbb9748b  ci-fixtures/default.ccm" | sha256sum -c -
          cp ci-fixtures/default.ccm ci-fixtures/default.ccm.meta.json ci-fixtures/language-l3.json native-prototype/python/codeccat/models/
          cp ci-fixtures/stable23-f64.ccm native-prototype/model/stable23.ccm
          cp ci-fixtures/api-parity-goldens.jsonl ci-fixtures/api-model-fingerprint.txt ci-fixtures/l2-numeric-goldens.jsonl native-prototype/
          # The generated model directory is .gitignored by design.
          # Register files in the *ephemeral Actions index* so the direct
          # maturin CLI includes the same assets as the PEP-517 wheel build.
          # No model bytes are ever committed to Git.
          git add -f -N native-prototype/python/codeccat/models/default.ccm native-prototype/python/codeccat/models/default.ccm.meta.json native-prototype/python/codeccat/models/language-l3.json
          git status --short native-prototype/python/codeccat/models/

      - name: Build with PEP-517 inside manylinux 2_28 (same proven packaging path)
        shell: bash
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm -v "$PWD:/project" -w /project "$IMAGE" /bin/bash -ec '
            curl -fsSL --retry 3 https://sh.rustup.rs | sh -s -- -y --profile minimal
            export PATH="/opt/python/cp312-cp312/bin:$HOME/.cargo/bin:$PATH"
            /opt/python/cp312-cp312/bin/python -m pip install --disable-pip-version-check build==1.3.0 maturin==1.9.4
            MATURIN_PEP517_ARGS="--compatibility manylinux_2_28" /opt/python/cp312-cp312/bin/python -m build --no-isolation --wheel --outdir dist .
          '
      - name: Audit and install in actual manylinux 2_28 container
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          IMAGE: ${{ matrix.image }}
        run: |
          python -m pip install auditwheel==6.5.0
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib,os
          files=list(Path("dist").glob("*.whl"))
          assert len(files)==1, files
          wheel=files[0]
          assert f"manylinux_2_28_{os.environ['ARCH']}" in wheel.name,wheel.name
          with ZipFile(wheel) as z:
              print("MANYLINUX_WHEEL_CONTENTS",z.namelist(),flush=True)
              assert z.testzip() is None
              model=z.read("codeccat/models/default.ccm")
              assert hashlib.sha256(model).hexdigest()=="16073306b5027bf93acc2883f57fbda0cb0cf2d77b9a7bb62cf1b07fcbb9748b"
              md=z.read(next(n for n in z.namelist() if n.endswith(".dist-info/METADATA"))).decode()
              import json
              from pathlib import Path
              version=json.loads(Path("release-config.json").read_text())["version"]
              assert f"Version: {version}" in md
          print("MANYLINUX_WHEEL_AUDIT_PASS",wheel.name)
          PY
          auditwheel show dist/*.whl
          docker run --rm -v "$PWD:/work:ro" -w /work "$IMAGE" /bin/bash -ec '
            /opt/python/cp312-cp312/bin/python -m venv /tmp/wheel-test
            /tmp/wheel-test/bin/pip install --no-deps dist/*.whl
            /tmp/wheel-test/bin/python -c "import codeccat; assert codeccat.detect(b\"hello\").text==\"hello\"; assert codeccat.decode(\"日本語\".encode(\"utf-8\"))==\"日本語\"; print(\"MANYLINUX_CONTAINER_INSTALL_PASS\")"
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stable-manylinux-${{ matrix.label }}
          path: dist/*.whl
          retention-days: 30
