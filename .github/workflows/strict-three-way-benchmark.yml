name: Strict 3003 paired three-way benchmark
on:
  push:
    branches: [research/encoding-identifiability-audit]
    paths:
      - experiments/logic_first/strict_three_way_benchmark.py
      - .github/workflows/strict-three-way-benchmark.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paired:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: chardet/test-data
          ref: b0c0d206913ba118ffea2f7d306883e7a4a76db7
          path: training
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy==2.5.3 scipy==1.18.1 scikit-learn==1.9.1 joblib==1.6.0 chardet==7.0.1 charset-normalizer==3.4.4
      - run: PYTHONPATH=src:experiments/logic_first python experiments/logic_first/strict_three_way_benchmark.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: strict-three-way-results
          path: research-results/strict-three-way/
          retention-days: 30
