name: Offline trainer to published Runtime E2E

on:
  push:
    branches:
      - main
      - staging/trainer-e2e-20261106
    paths:
      - "native-prototype/training/**"
      - ".github/workflows/trainer-e2e.yml"
  pull_request:
    paths:
      - "native-prototype/training/**"
      - ".github/workflows/trainer-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train-and-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install trainer in its own isolated environment
        shell: bash
        run: |
          python -m venv .train-env
          .train-env/bin/python -m pip install --disable-pip-version-check ./native-prototype/training
          .train-env/bin/python -m unittest discover -s native-prototype/training/tests -v
      - name: Generate deterministic synthetic fixtures (no upstream corpora)
        run: .train-env/bin/python native-prototype/training/make_smoke_data.py
      - name: Run offline training twice with same seed
        shell: bash
        run: |
          mkdir -p trainer-results
          .train-env/bin/python -m codeccat_train             --manifest native-prototype/training/smoke-data/manifest.jsonl             --output trainer-results/custom.ccm             --report trainer-results/training-report.json --seed 20261015
          .train-env/bin/python -m codeccat_train             --manifest native-prototype/training/smoke-data/manifest.jsonl             --output trainer-results/repeat.ccm             --report trainer-results/repeat-report.json --seed 20261015
          cmp trainer-results/custom.ccm trainer-results/repeat.ccm
          .train-env/bin/python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path("trainer-results/training-report.json").read_text())
          b=json.loads(Path("trainer-results/repeat-report.json").read_text())
          assert a==b
          print("TRAINER_SAME_ENV_REPRODUCIBLE_PASS",a["model_sha256"])
          PY
      - name: Install published Stable runtime separately without training dependencies
        shell: bash
        run: |
          python -m venv .runtime-env
          .runtime-env/bin/python -m pip install --disable-pip-version-check --only-binary=:all: --no-deps codeccat==0.1.0
      - name: Test the model with the actual Stable Runtime API
        run: .runtime-env/bin/python native-prototype/training/tests/check_runtime_e2e.py
      - name: Compare candidate with published default on labeled validation bytes
        shell: bash
        run: |
          .runtime-env/bin/python - <<'PY'
          import sys
          from pathlib import Path
          # Evaluation module has no training/NumPy imports.
          sys.path.insert(0, str(Path("native-prototype/training/src").resolve()))
          from codeccat_train.evaluate import evaluate
          x=evaluate(
              Path("native-prototype/training/smoke-data/manifest.jsonl"),
              Path("trainer-results/custom.ccm"),
              Path("trainer-results/comparison.json"),
              split="validation",
          )
          assert x["results"]["candidate"]["n"] == 12
          assert x["paired"]["helps"] + x["paired"]["harms"] + x["paired"]["both_correct"] + x["paired"]["both_wrong"] == 12
          assert sum(v["n"] for v in x["by_codec"].values()) == 12
          print("TRAINER_MODEL_COMPARISON_PASS", x["paired"])
          PY
      - name: Verify CLI evaluation with official runtime installed in trainer environment
        shell: bash
        run: |
          .train-env/bin/python -m pip install --disable-pip-version-check --only-binary=:all: --no-deps codeccat==0.1.0
          .train-env/bin/python -m codeccat_train evaluate \
            --model trainer-results/custom.ccm \
            --manifest native-prototype/training/smoke-data/manifest.jsonl \
            --split validation \
            --report trainer-results/comparison-cli.json
          .train-env/bin/python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path("trainer-results/comparison-cli.json").read_text())
          b=json.loads(Path("trainer-results/comparison.json").read_text())
          assert a==b
          assert a["results"]["candidate"]["correct_text"]==12
          print("TRAINER_COMPARE_CLI_AND_API_PASS")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trainer-p0-report
          path: |
            trainer-results/training-report.json
            trainer-results/repeat-report.json
            trainer-results/comparison.json
            trainer-results/comparison-cli.json
          if-no-files-found: ignore
          retention-days: 7
