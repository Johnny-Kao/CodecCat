name: Isolated macOS ARM64 Trainer E2E

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/trainer-macos-arm64.yml"

permissions:
  contents: read

jobs:
  native-macos-arm64:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: arm64
      - name: Assert actual Apple Silicon runner and Python
        shell: bash
        run: |
          test "$(uname -s)" = "Darwin"
          test "$(uname -m)" = "arm64"
          python - <<'PY'
          import platform,sys
          assert platform.machine() == "arm64", platform.machine()
          assert sys.maxsize > 2**32
          print("MACOS_ARM64_NATIVE_RUNNER",platform.mac_ver(),platform.machine())
          PY
      - name: Train native CCM1 and CCM2 with separate Trainer dependencies
        shell: bash
        run: |
          python -m venv .train-env
          .train-env/bin/python -m pip install --disable-pip-version-check ./native-prototype/training
          .train-env/bin/python -m unittest discover -s native-prototype/training/tests -v
          .train-env/bin/python native-prototype/training/make_smoke_data.py
          mkdir -p trainer-results
          .train-env/bin/python -m codeccat_train fit \
            --manifest native-prototype/training/smoke-data/manifest.jsonl \
            --output trainer-results/custom.ccm \
            --report trainer-results/training-report.json
          .train-env/bin/python -m codeccat_train fit \
            --manifest native-prototype/training/smoke-data/manifest.jsonl \
            --output trainer-results/custom-f32.ccm \
            --report trainer-results/training-report-f32.json --precision f32
      - name: Verify native generated CCM files with isolated published Runtime
        shell: bash
        run: |
          python -m venv .runtime-env
          .runtime-env/bin/python -m pip install --disable-pip-version-check --no-deps --only-binary=:all: codeccat==0.1.0
          .runtime-env/bin/python native-prototype/training/tests/check_runtime_e2e.py
          .runtime-env/bin/python native-prototype/training/tests/check_ccm2_e2e.py
      - name: Report only architecture and model hashes
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,platform
          from pathlib import Path
          assert platform.machine()=="arm64"
          for precision, filename in (("f64","custom.ccm"),("f32","custom-f32.ccm")):
              raw=Path("trainer-results",filename).read_bytes()
              assert raw.startswith(b"CCM1" if precision=="f64" else b"CCM2")
              print("MACOS_ARM64_TRAINED_MODEL_PASS",precision,len(raw),hashlib.sha256(raw).hexdigest())
          PY
