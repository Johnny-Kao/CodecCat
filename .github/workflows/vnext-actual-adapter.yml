name: vNext actual adapter grouped validation
on:
  push:
    branches: [staging/initial-package]
    paths:
      - ".github/workflows/vnext-actual-adapter.yml"
      - "experiments/logic_first/vnext_actual_adapter.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paired:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: chardet/test-data
          ref: b0c0d206913ba118ffea2f7d306883e7a4a76db7
          path: fixtures
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy==2.5.3 scipy==1.18.1 scikit-learn==1.9.1 joblib==1.6.0
      - name: Test ACTUAL trainable detector code
        run: PYTHONPATH=src python experiments/logic_first/vnext_actual_adapter.py --fixtures fixtures
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vnext-actual-adapter-result
          path: research-results/vnext-actual-adapter/
          retention-days: 30
