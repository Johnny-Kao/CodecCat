name: vNext annual candidate retrain (no promotion)
on:
  workflow_dispatch:
    inputs:
      training_year:
        description: "Training cohort year (not release date)"
        required: true
        default: "2026"
        type: string
permissions:
  contents: read
jobs:
  train:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: chardet/test-data
          ref: b0c0d206913ba118ffea2f7d306883e7a4a76db7
          path: training
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy==2.5.3 scipy==1.18.1 scikit-learn==1.9.1 joblib==1.6.0
      - name: Train both annual candidates and verify numeric archives
        run: PYTHONPATH=src python experiments/logic_first/vnext_annual_retrain.py --year ${{ inputs.training_year }} --training training --training-commit b0c0d206913ba118ffea2f7d306883e7a4a76db7
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: vnext-annual-candidates-${{ inputs.training_year }}
          path: research-results/vnext-annual-models/
          retention-days: 30
