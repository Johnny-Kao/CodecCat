name: Frozen independent CC0 accuracy confirmation (one shot)
on:
  push:
    branches: [research/accuracy-data-gate-v2]
    paths:
      - ".github/workflows/vnext-cc0-one-shot.yml"
      - "experiments/logic_first/vnext_cc0_external_confirmation.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  one-shot:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: chardet/test-data
          ref: b0c0d206913ba118ffea2f7d306883e7a4a76db7
          path: fixtures
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned training and latest competitor versions
        run: python -m pip install numpy==2.5.3 scipy==1.18.1 scikit-learn==1.9.1 joblib==1.6.0 chardet==7.7.0 charset-normalizer==3.5.2
      - name: Enforce complete prior CC0 freeze SHA before accuracy scoring
        run: PYTHONPATH=src python experiments/logic_first/vnext_cc0_external_confirmation.py --fixtures fixtures
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: one-shot-frozen-cc0-independent-quality
          path: research-results/cc0-one-shot/
          retention-days: 90
