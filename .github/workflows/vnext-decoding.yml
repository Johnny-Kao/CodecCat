name: vNext strict decoded-text contract
on:
  push:
    branches: [staging/initial-package]
    paths:
      - ".github/workflows/vnext-decoding.yml"
      - "src/codeccat/vnext_decoding.py"
      - "src/codeccat/vnext_bom.py"
      - "src/codeccat/vnext_strong_l2.py"
      - "tests/test_vnext_decoding.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy==2.5.3 scipy==1.18.1 scikit-learn==1.9.1 joblib==1.6.0 pytest==8.4.2
      - run: PYTHONPATH=src python -m pytest -q tests/test_vnext_decoding.py tests/test_vnext_strong_l2.py tests/test_vnext_gate.py tests/test_vnext_bom.py
