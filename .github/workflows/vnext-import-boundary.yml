name: vNext and legacy namespace isolation
on:
  push:
    branches: [staging/initial-package]
    paths:
      - "src/codeccat/__init__.py"
      - "tests/test_vnext_import_boundary.py"
      - ".github/workflows/vnext-import-boundary.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy==2.5.3 scipy==1.18.1 scikit-learn==1.9.1 joblib==1.6.0 pytest==8.4.2
      - run: PYTHONPATH=src python -m pytest -q tests/test_vnext_import_boundary.py tests/test_vnext_strong_l2.py tests/test_vnext_gate.py tests/test_vnext_bom.py
