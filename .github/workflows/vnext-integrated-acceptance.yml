name: vNext integrated acceptance GO-NO-GO
on:
  push:
    branches: [staging/initial-package]
    paths: [".github/workflows/vnext-integrated-acceptance.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: chardet/test-data
          ref: b0c0d206913ba118ffea2f7d306883e7a4a76db7
          path: training
      - uses: actions/checkout@v4
        with:
          repository: unicode-org/icu
          ref: ad110a2381f1b75bfb875fb0b672b7c38dce4e4b
          path: icu-fixture
          sparse-checkout: |
            icu4c/source/test/testdata/csdetest.xml
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy==2.5.3 scipy==1.18.1 scikit-learn==1.9.1 joblib==1.6.0 chardet==7.6.0 charset-normalizer==3.4.4 pytest==8.4.2
      - name: End-to-end structural, model, and BOM regression contracts
        run: PYTHONPATH=src python -m pytest -q tests/test_vnext_*.py
      - name: Frozen annual candidate build with verified source commit
        run: PYTHONPATH=src python experiments/logic_first/vnext_annual_retrain.py --year 2026 --training training --training-commit b0c0d206913ba118ffea2f7d306883e7a4a76db7
      - name: Replay pre-registered ICU source results (not a new blind test)
        run: >-
          PYTHONPATH=src python experiments/logic_first/vnext_icu_confirmation.py
          --train training
          --fixture icu-fixture/icu4c/source/test/testdata/csdetest.xml
          --icu-commit ad110a2381f1b75bfb875fb0b672b7c38dce4e4b
          --train-commit b0c0d206913ba118ffea2f7d306883e7a4a76db7
      - name: Separate process inference resources stable23
        run: >-
          PYTHONPATH=src python experiments/logic_first/vnext_inference_resources.py
          --model research-results/vnext-annual-models/codeccat-2026-stable23.zip
          --manifest research-results/vnext-annual-models/manifest.json --profile stable23
      - name: Separate process inference resources experimental13
        run: >-
          PYTHONPATH=src python experiments/logic_first/vnext_inference_resources.py
          --model research-results/vnext-annual-models/codeccat-2026-experimental13.zip
          --manifest research-results/vnext-annual-models/manifest.json --profile experimental13
      - name: Compute release decision separately from CI success
        run: >-
          python experiments/logic_first/vnext_release_decision.py
          --icu-report research-results/vnext-icu-confirmation/report.json
          --annual-manifest research-results/vnext-annual-models/manifest.json
          --stable-resource research-results/vnext-resources/stable23.json
          --experimental-resource research-results/vnext-resources/experimental13.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vnext-integrated-acceptance-evidence
          path: |
            research-results/vnext-final-e2e/
            research-results/vnext-icu-confirmation/
            research-results/vnext-resources/
            research-results/vnext-annual-models/manifest.json
          retention-days: 30
