name: Stable23 post-fit model isolation (research)
on:
  push:
    branches: [research/training-strategy-audit]
    paths:
      - ".github/workflows/vnext-model-postfit-isolation.yml"
      - "experiments/logic_first/vnext_model_postfit_isolation.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  model-isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: chardet/test-data
          ref: b0c0d206913ba118ffea2f7d306883e7a4a76db7
          path: fixtures
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy==2.5.3 scipy==1.18.1 scikit-learn==1.9.1 joblib==1.6.0
      - run: test "$(git -C fixtures rev-parse HEAD)" = "b0c0d206913ba118ffea2f7d306883e7a4a76db7"
      - name: Compare baseline detector before and after fitting another model
        run: PYTHONPATH=src python experiments/logic_first/vnext_model_postfit_isolation.py --fixtures fixtures
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stable23-postfit-model-isolation-proof
          path: research-results/postfit-isolation/
          retention-days: 30
