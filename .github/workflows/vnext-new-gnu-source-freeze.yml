name: Preregister fresh Gawk and Bash native charset test bytes
on:
  push:
    branches: [research/accuracy-data-gate-v2]
    paths:
      - ".github/workflows/vnext-new-gnu-source-freeze.yml"
      - "experiments/logic_first/vnext_new_gnu_source_freeze.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  freeze-untouched:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: gnu-mirror-unofficial/gawk
          ref: 455c99c010eafca5729081954d23059e3cbca571
          path: gawk
          sparse-checkout: |
            po
          sparse-checkout-cone-mode: true
      - uses: actions/checkout@v4
        with:
          repository: gnu-mirror-unofficial/bash
          ref: 9439ce094c9aa7557a9d53ac7b412a23aa66e36b
          path: bash
          sparse-checkout: |
            po
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Freeze labels, source hashes and byte selection without decoding model predictions
        run: python experiments/logic_first/vnext_new_gnu_source_freeze.py --gawk gawk --bash bash
      - uses: actions/upload-artifact@v4
        with:
          name: preregistered-gawk-bash-real-byte-source
          path: research-results/new-gnu-source-freeze
          retention-days: 90
