name: vNext paired competitor accuracy audit
on:
  push:
    branches: [staging/initial-package]
    paths:
      - ".github/workflows/vnext-paired-accuracy.yml"
      - "src/codeccat/vnext_strong_l2.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paired:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: chardet/test-data
          ref: b0c0d206913ba118ffea2f7d306883e7a4a76db7
          path: fixtures
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy==2.5.3 scipy==1.18.1 scikit-learn==1.9.1 joblib==1.6.0 chardet==5.2.0 charset-normalizer==3.4.4
      - run: PYTHONPATH=src python experiments/logic_first/vnext_paired_accuracy.py --fixtures fixtures
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vnext-paired-accuracy-audit
          path: research-results/vnext-paired-audit/
          retention-days: 30
