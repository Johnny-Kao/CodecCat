name: vNext stronger L2 source-grouped development comparison
on:
  push:
    branches: [staging/initial-package]
    paths: [".github/workflows/vnext-strong-l2-dev.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  one:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: chardet/test-data
          ref: b0c0d206913ba118ffea2f7d306883e7a4a76db7
          path: fixtures
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy==2.5.3 scipy==1.18.1 scikit-learn==1.9.1
      - name: Compare independently trained L2 families with L1 and selective L3
        run: PYTHONPATH=fixtures/scripts python experiments/logic_first/vnext_strong_l2_dev.py --fixtures fixtures
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vnext-strong-l2-development
          path: research-results/vnext-strong-model-dev/
          retention-days: 30
