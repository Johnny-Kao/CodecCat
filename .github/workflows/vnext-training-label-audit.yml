name: Pinned training corpus label-integrity audit (research)
on:
  push:
    branches: [research/accuracy-data-gate-v2]
    paths:
      - ".github/workflows/vnext-training-label-audit.yml"
      - "experiments/logic_first/vnext_training_label_integrity.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  training-data-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: chardet/test-data
          ref: b0c0d206913ba118ffea2f7d306883e7a4a76db7
          path: original-training
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy==2.5.3 scipy==1.18.1 scikit-learn==1.9.1 joblib==1.6.0
      - name: Audit possible mislabeled single-byte source data before retraining
        run: PYTHONPATH=src python experiments/logic_first/vnext_training_label_integrity.py --fixtures original-training
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-label-quality-original-training
          path: research-results/training-label-audit/
          retention-days: 60
