name: vNext unified training MVP
# Manual-only: training contract included in the consolidated research gate.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  training-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install training dependencies
        run: |
          python -m pip install numpy==2.5.3 scipy==1.18.1 scikit-learn==1.9.1 pytest==8.4.2
          python -m pip install -e .
      - name: Static checks
        run: |
          python -m compileall -q src/codeccat/training.py tests/test_training_contract.py
      - name: Train test model from independent user-style manifest
        run: |
          python -m pytest -q tests/test_training_contract.py
