name: Training-strategy source-group accuracy audit (development)
on:
  push:
    branches:
      - research/training-strategy-audit
    paths:
      - ".github/workflows/vnext-training-strategy-audit.yml"
      - "experiments/logic_first/vnext_training_strategy_audit.py"
      - "src/codeccat/vnext_strong_l2.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  accuracy-attribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: chardet/test-data
          ref: b0c0d206913ba118ffea2f7d306883e7a4a76db7
          path: training
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned model dependencies
        run: python -m pip install numpy==2.5.3 scipy==1.18.1 scikit-learn==1.9.1 joblib==1.6.0
      - name: Check immutable training corpus
        run: |
          test "$(git -C training rev-parse HEAD)" = "b0c0d206913ba118ffea2f7d306883e7a4a76db7"
      - name: Compare identical grouped fold rows across three training strategies
        run: |
          PYTHONPATH=src python experiments/logic_first/vnext_training_strategy_audit.py --fixtures training --label-cap 48
      - name: Persist case-level traces and attribution report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stable23-training-strategy-development-audit
          path: research-results/training-strategy-audit/
          retention-days: 30
