name: UTF-8 structural evidence safety vs false-positive screen
on:
  push:
    branches: [research/accuracy-data-gate-v2]
    paths:
      - ".github/workflows/vnext-utf8-evidence-screen.yml"
      - "experiments/logic_first/vnext_utf8_evidence_screen.py"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  grouped-safety-screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: vim/vim
          ref: cbe1cf017d9027c8e34599333ef69d7e20e1bf8d
          path: real-source
          sparse-checkout: |
            src/po
          sparse-checkout-cone-mode: true
      - uses: actions/checkout@v4
        with:
          repository: chardet/test-data
          ref: b0c0d206913ba118ffea2f7d306883e7a4a76db7
          path: training
      - uses: actions/download-artifact@v4
        with:
          name: frozen-real-vim-catalog-windows
          run-id: 41238184283
          github-token: ${{ github.token }}
          path: source-manifest
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy==2.5.3 scipy==1.18.1 scikit-learn==1.9.1 joblib==1.6.0 chardet==7.7.0 charset-normalizer==3.5.2
      - name: Screen no new model architecture; only codepoint support vs false positives
        run: PYTHONPATH=src python experiments/logic_first/vnext_utf8_evidence_screen.py --source real-source --training training --manifest source-manifest/source_manifest.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: utf8-evidence-ambiguity-risk-analysis
          path: research-results/utf8-validity-screen/
          retention-days: 60
