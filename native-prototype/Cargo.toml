[package]
name = "codeccat-native-prototype"
version = "0.1.1"
edition = "2021"
publish = false

[lib]
name = "_codeccat_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py310"] }
sha2 = "0.10"
memmap2 = "0.9"

[profile.release]
lto = "thin"
codegen-units = 1
