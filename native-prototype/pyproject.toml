[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "codeccat"
version = "0.1.0a4"
description = "Native character-encoding detection and strict Unicode decoding"
readme = "README.md"
license = "MIT"
authors = [{name = "Johnny Kao"}]
classifiers = ["Programming Language :: Python :: 3", "Programming Language :: Rust", "Operating System :: OS Independent"]
requires-python = ">=3.10"
dependencies = []

[project.urls]
Repository = "https://github.com/Johnny-Kao/CodecCat"

[project.optional-dependencies]
legacy = ["numpy>=2.0"]

[project.scripts]
codeccat = "codeccat.cli:main"

[tool.maturin]
python-source = "python"
module-name = "codeccat._codeccat_native"
bindings = "pyo3"
include = ["python/codeccat/models/*.ccm", "python/codeccat/models/*.json"]
