[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "codeccat"
version = "0.1.0a3"
description = "Experimental zero-NumPy native CodecCat runtime (staging only)"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
codeccat = "codeccat.cli:main"

[tool.maturin]
python-source = "python"
module-name = "codeccat._codeccat_native"
bindings = "pyo3"
include = ["python/codeccat/models/*.ccm"]
