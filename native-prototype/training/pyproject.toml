[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "codeccat-train"
version = "0.1.0"
description = "Offline trainer and evaluator for CodecCat native encoding models"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Johnny Kao" }]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Intended Audience :: Developers",
  "Topic :: Text Processing :: General",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = ["numpy>=2.0", "scikit-learn>=1.4,<2"]

[project.urls]
Repository = "https://github.com/Johnny-Kao/CodecCat"
Issues = "https://github.com/Johnny-Kao/CodecCat/issues"
Documentation = "https://github.com/Johnny-Kao/CodecCat/blob/main/native-prototype/training/docs/GETTING_STARTED.md"

[project.scripts]
codeccat-train = "codeccat_train.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/codeccat_train"]
