[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "codeccat"
version = "0.1.0a3"
description = "Native character-encoding detection and strict Unicode decoding"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Johnny Kao" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Operating System :: OS Independent",
]
dependencies = []

[project.urls]
Repository = "https://github.com/Johnny-Kao/CodecCat"

[project.optional-dependencies]
legacy = ["numpy>=2.0"]

[project.scripts]
codeccat = "codeccat.cli:main"

[tool.maturin]
manifest-path = "native-prototype/Cargo.toml"
python-source = "native-prototype/python"
module-name = "codeccat._codeccat_native"
bindings = "pyo3"
include = [
  "native-prototype/python/codeccat/models/*.ccm",
  "native-prototype/python/codeccat/models/*.json",
]
